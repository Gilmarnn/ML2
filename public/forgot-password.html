<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Esqueci minha senha — Visium Seller</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="landing">
    <div class="landing-card">
      <span class="slash-tag">Recuperar acesso</span>
      <h1>Esqueci minha <span class="accent">senha</span></h1>
      <p>Informe o e-mail da sua conta. Se existir, enviamos um link pra você criar uma senha nova.</p>
      <form id="forgot-form" style="display:flex;flex-direction:column;gap:14px;text-align:left;margin-top:10px">
        <label style="font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.04em;display:flex;flex-direction:column;gap:6px">
          E-mail
          <input type="email" id="email" required style="background:var(--surface);border:1px solid var(--border);color:var(--text);padding:11px;border-radius:3px;font-size:15px" />
        </label>
        <p id="forgot-message" style="font-size:13px;display:none"></p>
        <button type="submit" class="btn-primary">Enviar link</button>
      </form>
      <p class="fine-print"><a href="/login.html" style="color:var(--primary)">Voltar pro login</a></p>
    </div>
  </main>
  <script src="forgot-password.js"></script>
</body>
</html>
