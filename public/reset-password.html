<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Redefinir senha — Diagnóstico ML</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="landing">
    <div class="landing-card">
      <span class="slash-tag">Nova senha</span>
      <h1>Criar <span class="accent">nova senha</span></h1>
      <form id="reset-form" style="display:flex;flex-direction:column;gap:14px;text-align:left;margin-top:10px">
        <label style="font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.04em;display:flex;flex-direction:column;gap:6px">
          Nova senha (mínimo 8 caracteres)
          <input type="password" id="new-password" minlength="8" required style="background:var(--surface);border:1px solid var(--border);color:var(--text);padding:11px;border-radius:3px;font-size:15px" />
        </label>
        <p id="reset-message" style="font-size:13px;display:none"></p>
        <button type="submit" class="btn-primary">Salvar nova senha</button>
      </form>
    </div>
  </main>
  <script src="reset-password.js"></script>
</body>
</html>
